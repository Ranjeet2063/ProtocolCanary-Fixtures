# Protocol 30 structural StellarValue vector for CAP-88's
# STELLAR_VALUE_SIGNED_MS arm (discriminant 3).
#
# The official stellar-xdr 30.0.0 Rust types encoded a typed StellarValue
# with tx_set_hash = Hash([0x11; 32]), close_time = 1_700_000_123,
# close_time_ms = 1_700_000_123_456, no upgrades, and the SignedMs arm.
# CAP-88 requires close_time == close_time_ms / 1000; the independent Python
# decoder test asserts both values and this relationship. It also checks the
# signature fields and re-encodes the bytes separately from the Rust source.
#
# The node id and 64-byte signature are deterministic sentinels. They are not
# cryptographically verified and do not represent a valid consensus vote.
# This fixture proves XDR structure only, not consensus validity or complete
# Protocol 30 compatibility.
#
# CAP-88: https://github.com/stellar/stellar-protocol/blob/1ae39233055a0fb94bb737650a39ede8d77d924c/core/cap-0088.md
# Generated XDR types at stellar/rs-stellar-xdr tag v30.0.0:
# https://github.com/stellar/rs-stellar-xdr/blob/v30.0.0/src/generated/stellar_value_ext.rs
# https://raw.githubusercontent.com/stellar/rs-stellar-xdr/v30.0.0/src/generated/stellar_value_type.rs

